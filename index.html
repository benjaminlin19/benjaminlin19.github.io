<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page use the full phone screen (notch-safe padding is in the CSS) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Portfolio | EECS Projects</title>
<meta name="description" content="EECS portfolio: PCB design, power electronics, embedded systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Oxanium:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<script>document.documentElement.classList.add("js")</script><!-- animations only hide content when JS works -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- TOP BAR: on phones the links collapse into the Menu button -->
<header class="bar">
  <a class="logo" href="index.html" data-name>Your Name</a>
  <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button>
  <nav class="menu" id="menu">
    <a href="#projects">Projects</a><a href="#about">About</a><a href="#skills">Skills</a><a href="#contact">Contact</a>
    <a data-link="resume" href="#">Resume</a>
  </nav>
</header>

<main>
  <!-- HERO: name and tagline come from js/projects.js -->
  <section class="hero wrap type">
    <h1 data-name>Your Name</h1>
    <p class="lead type" id="tagline"></p>
    <dl class="glance type" id="glance"></dl>
  </section>

  <!-- PROJECTS: numbered list generated from PROJECTS in js/projects.js -->
  <section class="block wrap reveal type" id="projects">
    <h2>Projects</h2>
    <div class="filters type" id="filters" role="group" aria-label="Filter projects"></div>
    <ol class="list" id="grid"></ol>
  </section>

  <section class="block wrap reveal" id="about"><h2>About</h2><p class="big type" id="about-text"></p></section>

  <section class="block wrap reveal" id="skills"><h2>Skills and tools</h2>
    <div id="skill-list"></div>
    <h3>Currently learning</h3><p id="learning"></p></section>

  <section class="block wrap reveal" id="contact"><h2>Contact</h2>
    <a class="mail" data-link="email" data-email href="#">you@example.com</a>
    <p class="links"><a data-link="linkedin" href="#">LinkedIn</a><a data-link="github" href="#">GitHub</a><a data-link="resume" href="#">Resume</a></p>
  </section>
</main>
<footer class="wrap foot"><span>&copy; <span data-name></span></span><span>Edit <code>js/projects.js</code> to update</span></footer>
<script src="js/projects.js"></script>
<script src="js/main.js"></script>
</body>
</html>
